name: Downstream CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api-unit-test:
    name: Laravel API Tests
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - uses: actions/checkout@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: pdo_sqlite, sqlite3
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.ci', '.env');"
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate key
        run: php artisan key:generate
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: vendor/bin/phpunit --exclude-group youtube
        env:
          YOUTUBE_KEY: test-placeholder
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
  vue-app-tests:
    name: Frontend Build and Tests
    # Temporarily disabled; remove this condition to restore frontend CI.
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: vue_app/test-results
